---
services:
  db:
    #build: ./database
    image: vasuch2626/python-app-db:v1
    deploy:
      replicas: 1
    ports:
      - "3306:3306"
    networks:
      - mynetwork

  auth_service:
    #build: ./auth
    image: vasuch2626/python-app-auth:v1
    deploy:
      replicas: 1
    ports:
      - "5001:5001"
    networks:
      - mynetwork
    #depends_on:
      #- db
    

  book_service:
    #build: ./book
    image: vasuch2626/python-app-book:v1
    deploy:
      replicas: 1
    ports:
      - "5002:5002"
    networks:
      - mynetwork
    depends_on:
      - db
  borrow_service:
    #build: ./borrow
    image: vasuch2626/python-app-borrow:v1
    deploy:
      replicas: 1
    ports:
      - "5003:5003"
    networks:
      - mynetwork
    #depends_on:
     # - db

  frontend:
    #build: ./templates
    image: vasuch2626/python-app-frontend:v1
    deploy:
      replicas: 1
    ports:
      - "5000:5000"
    networks:
      - mynetwork
    #depends_on:
      #- auth_service
      #- book_service
      #- borrow_service

networks:
  mynetwork:
    driver: overlay
